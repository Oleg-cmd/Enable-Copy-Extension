<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Enable Copy - Whitelist Settings</title>
    <style>
      /* Basic styles inline for simplicity */
      body {
        font-family: sans-serif;
        padding: 20px;
        max-width: 600px;
        margin: auto;
      }
      h1 {
        text-align: center;
      }
      #whitelistContainer {
        margin-top: 20px;
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 5px;
      }
      #whitelistList {
        list-style: none;
        padding: 0;
        max-height: 300px;
        overflow-y: auto;
        margin-bottom: 15px;
        border: 1px solid #eee;
        min-height: 50px;
      }
      #whitelistList li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px;
        border-bottom: 1px solid #eee;
      }
      #whitelistList li:last-child {
        border-bottom: none;
      }
      #whitelistList button {
        background-color: #f44336;
        color: white;
        border: none;
        padding: 5px 10px;
        border-radius: 3px;
        cursor: pointer;
        font-size: 12px;
        margin-left: 10px;
      }
      #addDomainContainer {
        margin-top: 20px;
        display: flex;
        gap: 10px;
      }
      #addDomainInput {
        flex-grow: 1;
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 3px;
      }
      #addDomainButton {
        padding: 8px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 3px;
        cursor: pointer;
      }
      #saveStatus {
        margin-top: 10px;
        font-weight: bold;
        text-align: center;
        height: 1.5em;
      } /* Increased height */
    </style>
  </head>
  <body>
    <h1>Whitelist Settings</h1>
    <p>
      The extension will not run on the domains listed below. Enter only the
      main part of the domain (e.g., <code>example.com</code>,
      <code>google.com</code>). <code>www.</code>, protocols
      (<code>http://</code>), and paths (<code>/page</code>) will be removed
      automatically.
    </p>

    <div id="whitelistContainer">
      <h2>Whitelisted Domains:</h2>
      <ul id="whitelistList">
        <!-- Domains will be loaded here by JS -->
        <li>Loading...</li>
      </ul>
      <div id="addDomainContainer">
        <input
          type="text"
          id="addDomainInput"
          placeholder="e.g., example.com"
        />
        <button id="addDomainButton">Add Domain</button>
      </div>
      <div id="saveStatus"></div>
      <!-- Status messages appear here -->
    </div>

    <!-- Load the single BUNDLED options script -->
    <script src="../scripts/options/options.js"></script>
  </body>
</html>
