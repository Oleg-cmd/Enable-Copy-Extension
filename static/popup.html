<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <link
      rel="stylesheet"
      type="text/css"
      href="./styles.css"
    />
    <title>Enable Copy Control</title>
  </head>
  <body>
    <div class="popup">
      <!-- Elements with IDs used by uiUpdater.js -->
      <div
        class="btn"
        id="toggleExtension"
      >
        Loading...
      </div>
      <div
        class="btn btn-secondary"
        id="forceEnable"
      >
        Loading...
      </div>
      <div
        class="tooltip"
        id="forceTooltip"
        style="display: none"
      >
        Use Force Copy mode only if normal mode doesn't work. May break site
        features. Will need full page reload to disable Force Copy mode.
      </div>
      <!-- OCR Tool Section -->
      <div
        id="ocrSection"
        style="
          margin-top: 15px;
          padding-top: 10px;
          border-top: 1px solid #eee;
          text-align: center;
          width: 100%;
        "
      >
        <div
          style="
            color: #1a73e8;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 12px;
          "
        >
          OCR Text Extractor
        </div>
        <button
          id="startOCR"
          class="btn"
          style="
            background-color: #1a73e8;
            color: #fff;
            width: 100%;
            margin-bottom: 5px;
          "
        >
          Select Area & Extract Text
        </button>
        <div
          id="ocrStatus"
          style="font-size: 11px; color: #666; margin-top: 5px; display: none"
        ></div>
      </div>
      <div
        id="whitelistSection"
        style="
          margin-top: 15px;
          padding-top: 10px;
          border-top: 1px solid #eee;
          text-align: center;
          width: 100%;
        "
      >
        <div
          id="whitelistStatus"
          style="
            color: #e65100;
            font-weight: bold;
            margin-bottom: 8px;
            display: none;
          "
        ></div>
        <button
          id="addToWhitelist"
          class="btn"
          style="
            background-color: #ffc107;
            color: #000;
            width: 100%;
            margin-bottom: 5px;
          "
        >
          Loading...
        </button>
        <button
          id="settingsButton"
          class="btn"
          style="background-color: #17a2b8; color: #fff; width: 100%"
        >
          Settings
        </button>
      </div>
    </div>

    <!-- Load the single BUNDLED popup script -->
    <script src="../scripts/popup/popup.js"></script>
  </body>
</html>
